# golden テスト専用のparam.yml
#   generator/src/main/resources/param.yml のコピー。以下3点のみ異なる
#     - mainJavaDir / testJavaDir  : build/golden-actual へ出力する
#     - forceOverwriteImplementation: 実体クラスも毎回生成して比較対象に含める
#   main 側のparam.yml を変更したらこちらも合わせて更新すること
# JDBC 接続情報（必須）
jdbcUrl: jdbc:postgresql://localhost:56384/spring_jdbc_codegen
jdbcUser: spring_jdbc_codegen
jdbcPass: spring_jdbc_codegen
jdbcSchema: spring_jdbc_codegen

# Entity のパッケージ名（必須）
entityPackage: jp.green_code.spring_jdbc_codegen.test_app.entity

# Repository のパッケージ名（必須）
repositoryPackage: jp.green_code.spring_jdbc_codegen.test_app.repository

# Java 最上位フォルダ（必須）
#   相対パスの場合はparam.yml のフォルダからの相対
mainJavaDir: ../../../../build/golden-actual/main

# Java Test 最上位フォルダ（テスト作成時必須）
#   相対パスの場合はparam.yml のフォルダからの相対
testJavaDir: ../../../../build/golden-actual/test

# 対象外テーブル（省略可）
#   記載のテーブルに対してはEntity, Repository, TestRepository のいずれも作成しない
#excludedTableNames:
#  - spring_session
#  - spring_session_attributes

# Enum 型登録（省略可）
#   DBの型とJava (enum) の型を下の形式で指定します
#   status_enum: jp.green_code.spring_jdbc_codegen.test_app.StatusEnum
enumJavaTypeMappings:
  status_enum: jp.green_code.spring_jdbc_codegen.test_app.StatusEnum

# returning 取得カラム（省略可）
#   トリガーなどDB 側で値が決まるカラムを指定します
#   insert やupdate の後、returning で取得してentity へ書き戻します
#   テーブル名とカラム名を下の形式で指定します
#   table_name:
#     - column_name
#   テーブルに* を指定すると全テーブルのカラムが対象となります
returningColumnsByTable:
  "*":
    - updated_at
  "only_pk3_now":
    - pk2_now
  "coverage_test":
    - col_now_with_default
  "quoted_column_now":
    - "Updated"

# カラム名とJava プロパティ名の明示的マッピング設定（省略可）
#   通常、Spring Jdbc BeanPropertyRowMapper を使っているため、
#   スネークケースのカラム名をキャメルケースのJava のプロパティ名に自動変換されます
#   デフォルト変換を使わずに、任意のカラム名とJava プロパティ名を直接対応付ける場合に設定します
#   テーブル名とカラム名とJava プロパティ名を下の形式で指定します
#   table_name:
#     column_name: javaPropertyName
columnName2javaPropertyMap:
  "日本語Table":
    rename: renamedJavaName
  "coverage_test":
    mapped_nullable: mappedNullableJavaName
  "mapper_no_pk":
    rename_target: renamedNoPkName

# Entity パッケージに @NullUnmarked を付けるかどうか（省略可）
#   初期値 false(付けない)
#   付ける場合{entityPackage} と{entityPackage}.{basePackageName} にpackage-info.java を作成します。また、必要な箇所に @Nullable を追加します。
enableNullUnmarkedForEntityPackages: true

# 実体クラスの強制上書き（省略可）
#   初期値 false(しない)
forceOverwriteImplementation: true

# テスト対象テーブル（省略可）
#   指定されたテーブルのcrud テストコードを作成します
#   テーブルにPK がない場合はテストは作成されません
testTargetTable:
  - all_types
  - normal_pk0
  - normal_pk1
  - normal_pk3
  - omittable_pk0
  - omittable_pk1
  - omittable_pk3
  - only_pk1
  - only_pk3
  - only_pk3_now
  - all_types_as_pk
  - 日本語Table
  - coverage_test
  - quoted_column_now

#
# 以下、高度な設定
#

# 基底クラスのパッケージ名（省略可）
#   初期値 base
#basePackageName: base

# Entity クラスの接頭辞（省略可）
#   初期値 空文字列
#entityClassNamePrefix: ""

# Entity クラスの接尾辞（省略可）
#   初期値 空文字列
#entityClassNameSuffix: Entity

# Repository クラスの接頭辞（省略可）
#   初期値 空文字列
#repositoryClassNamePrefix: ""

# Repository クラスの接尾辞（省略可）
#   初期値 Repository
#repositoryClassNameSuffix: Repository

# TestRepository クラスの接頭辞（省略可）
#   初期値 Test
#testRepositoryClassNamePrefix: Test

# TestRepository クラスの接尾辞（省略可）
#   初期値 空文字列
#testRepositoryClassNameSuffix:

# ヘルパークラス名（省略可）
#   初期値 RepositoryHelper
#repositoryHelperClassName: RepositoryHelper

# カラム定義クラス名（省略可）
#   初期値 ColumnDefinition
#columnDefinitionClassName: ColumnDefinition

# Mapper クラスの接頭辞（省略可）
#   初期値 Test
#mapperClassNamePrefix:

# Mapper クラスの接尾辞（省略可）
#   初期値 Mapper
#mapperClassNameSuffix: Mapper
